name: Update profile

on:
  schedule:
    - cron: "23 18 * * *" # every day at 23:53 IST
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fonttools brotli

      - name: Rebuild static cards
        run: python scripts/build_assets.py

      - name: Refresh stats card
        continue-on-error: true # a GitHub API hiccup should not block the snake
        env:
          # Add a PROFILE_TOKEN secret (classic PAT, read:user) to count private contributions too.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python scripts/update_stats.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#39d353
            assets/snake-light.svg?color_snake=#1f883d

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
